Music.CommandsHelp="Music Director is the clock the whole suite follows. Phrase is now re-anchors the phrase/bar grid to the current beat (fixes a grid off by a bar). Tap tempo sets the tempo from taps and holds it; Lock BPM toggles that hold (or freezes whatever tempo is running). Nudge shifts the beat phase a small step. Drop now and Force breakdown force the section; Palette Director, Clip Director and Scene Director follow through the clock API."
